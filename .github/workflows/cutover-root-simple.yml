name: Simple verified 00ai.kr root cutover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cutover-root-simple.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare IDs
        shell: bash
        run: |
          set -euo pipefail
          ZONES="$(curl -fsS -G -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-urlencode name=00ai.kr --data-urlencode status=active https://api.cloudflare.com/client/v4/zones)"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          ACCOUNT_ID="$(jq -r '.result[0].account.id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID"
          test -n "$ACCOUNT_ID"
          echo "ZONE_ID=$ZONE_ID" >> "$GITHUB_ENV"
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Verify replacement Worker before switch
        shell: bash
        run: |
          set -euo pipefail
          URL="https://00ai-root-router-debug-v2.able001.workers.dev"
          test "$(curl -ksS --max-time 30 -o /tmp/pre-root -w '%{http_code}' "$URL/")" = "200"
          test "$(curl -ksS --max-time 30 -o /tmp/pre-api -w '%{http_code}' "$URL/api/projects")" = "200"
          grep -q 'policy.00ai.kr' /tmp/pre-api
          grep -q 'yhub.00ai.kr' /tmp/pre-api
          python3 -c 'import json; d=json.load(open("/tmp/pre-api")); assert len(d.get("siteProjects",[])) >= 10'

      - name: Switch exact apex domain and route
        shell: bash
        run: |
          set -euo pipefail
          DOMAINS="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains")"
          DOMAIN_ID="$(jq -r '[.result[] | select(.hostname=="00ai.kr")][0].id // ""' <<<"$DOMAINS")"
          if [[ -n "$DOMAIN_ID" ]]; then
            curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains/$DOMAIN_ID" | jq -e '.success == true' >/dev/null
          fi

          ROUTES="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes")"
          ROUTE_ID="$(jq -r '[.result[] | select(.pattern=="00ai.kr/*")][0].id // ""' <<<"$ROUTES")"
          if [[ -n "$ROUTE_ID" ]]; then
            curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$ROUTE_ID" | jq -e '.success == true' >/dev/null
          fi

          BODY="$(jq -nc --arg h 00ai.kr --arg s 00ai-root-router-debug-v2 --arg z "$ZONE_ID" '{hostname:$h,service:$s,zone_id:$z,zone_name:"00ai.kr"}')"
          curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$BODY" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains" | tee /tmp/attach.json | jq -e '.success == true' >/dev/null

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          OK=0
          for n in 1 2 3 4 5 6 7 8; do
            sleep 8
            RC="$(curl -ksS --max-time 20 -D /tmp/root-h -o /tmp/root-b -w '%{http_code}' https://00ai.kr/ || true)"
            AC="$(curl -ksS --max-time 20 -D /tmp/api-h -o /tmp/api-b -w '%{http_code}' https://00ai.kr/api/projects || true)"
            MARK="$(tr -d '\r' < /tmp/root-h 2>/dev/null | grep -i '^x-00ai-root-router:' | head -n1 || true)"
            if [[ "$RC" == 200 && "$AC" == 200 && "$MARK" == *v2* ]] && grep -q 'policy.00ai.kr' /tmp/api-b && grep -q 'yhub.00ai.kr' /tmp/api-b; then
              OK=1
              break
            fi
            echo "try=$n root=$RC api=$AC marker=$MARK"
          done
          test "$OK" = 1

          PLOC="$(curl -ksSI --max-time 20 https://00ai.kr/policy | tr -d '\r' | grep -i '^location:' | head -n1 | cut -d' ' -f2-)"
          HLOC="$(curl -ksSI --max-time 20 https://00ai.kr/harness | tr -d '\r' | grep -i '^location:' | head -n1 | cut -d' ' -f2-)"
          POLICY="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://policy.00ai.kr/api/hasa/health)"
          YHUB="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://yhub.00ai.kr/policies)"
          HARNESS="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://harness.00ai.kr/)"
          [[ "$PLOC" == https://policy.00ai.kr* ]]
          [[ "$HLOC" == https://harness.00ai.kr* ]]
          test "$POLICY" = 200
          test "$YHUB" = 200
          test "$HARNESS" = 200

          python3 - <<PY
          import json,pathlib,datetime
          d=json.load(open('/tmp/api-b'))
          out={'checked_at':datetime.datetime.utcnow().isoformat()+'Z','deployed':True,'service':'00ai-root-router-debug-v2','root':200,'api':200,'site_projects':len(d.get('siteProjects',[])),'github_projects':len(d.get('githubProjects',[])),'policy_redirect':'$PLOC','harness_redirect':'$HLOC','policy_api':int('$POLICY'),'yhub':int('$YHUB'),'harness':int('$HARNESS'),'healthy':True}
          pathlib.Path('.github/root-simple-health.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Roll back on failure
        if: failure()
        shell: bash
        run: |
          set +e
          if [[ -n "${ACCOUNT_ID:-}" && -n "${ZONE_ID:-}" ]]; then
            DOMAINS="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains")"
            DOMAIN_ID="$(jq -r '[.result[]? | select(.hostname=="00ai.kr")][0].id // ""' <<<"$DOMAINS")"
            if [[ -n "$DOMAIN_ID" ]]; then curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains/$DOMAIN_ID" >/dev/null; fi
            BODY="$(jq -nc --arg h 00ai.kr --arg s 00ai-portal --arg z "$ZONE_ID" '{hostname:$h,service:$s,zone_id:$z,zone_name:"00ai.kr"}')"
            curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$BODY" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains" >/dev/null
            ROUTES="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes")"
            COUNT="$(jq -r '[.result[]? | select(.pattern=="00ai.kr/*")]|length' <<<"$ROUTES")"
            if [[ "$COUNT" == 0 ]]; then
              BODY="$(jq -nc --arg p '00ai.kr/*' --arg s 00ai-portal '{pattern:$p,script:$s}')"
              curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$BODY" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" >/dev/null
            fi
          fi
          mkdir -p .github
          printf '{"checked_at":"%s","deployed":false,"healthy":false,"rolled_back":true}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/root-simple-health.json

      - name: Persist result
        if: always()
        run: |
          if [[ ! -f .github/root-simple-health.json ]]; then
            mkdir -p .github
            printf '{"checked_at":"%s","deployed":false,"healthy":false,"reason":"precheck failed; no switch made"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/root-simple-health.json
          fi
          git config user.name "00AI Bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add .github/root-simple-health.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update simple root cutover health [skip ci]"
            git push || true
          fi
