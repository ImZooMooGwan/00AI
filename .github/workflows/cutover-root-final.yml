name: Final atomic 00ai.kr root cutover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cutover-root-final.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Atomically replace apex Worker with rollback protection
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .github
          NEW_SERVICE="00ai-root-router-debug-v2"
          PREVIEW="https://00ai-root-router-debug-v2.able001.workers.dev"
          MUTATED=0
          SUCCESS=0

          VERIFY="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$(jq -r '.success' <<<"$VERIFY")" = true
          ZONES="$(curl -fsS -G -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-urlencode name=00ai.kr --data-urlencode status=active https://api.cloudflare.com/client/v4/zones)"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          ACCOUNT_ID="$(jq -r '.result[0].account.id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID"; test -n "$ACCOUNT_ID"

          # Confirm the exact Worker we are about to attach is healthy first.
          test "$(curl -ksS --max-time 30 -o /tmp/pre-root -w '%{http_code}' "$PREVIEW/")" = 200
          test "$(curl -ksS --max-time 30 -o /tmp/pre-api -w '%{http_code}' "$PREVIEW/api/projects")" = 200
          grep -q 'policy.00ai.kr' /tmp/pre-api
          grep -q 'yhub.00ai.kr' /tmp/pre-api
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pre-api'))
          assert len(d.get('siteProjects', [])) >= 10
          PY

          DOMAINS="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains")"
          OLD_DOMAIN_ID="$(jq -r '[.result[] | select(.hostname=="00ai.kr")][0].id // ""' <<<"$DOMAINS")"
          OLD_SERVICE="$(jq -r '[.result[] | select(.hostname=="00ai.kr")][0].service // ""' <<<"$DOMAINS")"
          ROUTES="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes")"
          OLD_ROUTE_ID="$(jq -r '[.result[] | select(.pattern=="00ai.kr/*")][0].id // ""' <<<"$ROUTES")"
          OLD_ROUTE_SCRIPT="$(jq -r '[.result[] | select(.pattern=="00ai.kr/*")][0].script // ""' <<<"$ROUTES")"
          echo "Backing up old_service=$OLD_SERVICE old_route=$OLD_ROUTE_SCRIPT"

          rollback() {
            rc=$?
            if [[ "$MUTATED" == 1 && "$SUCCESS" != 1 ]]; then
              echo "Cutover failed (rc=$rc); restoring previous apex bindings..."
              CUR="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains" || echo '{}')"
              CUR_ID="$(jq -r '[.result[]? | select(.hostname=="00ai.kr")][0].id // ""' <<<"$CUR" 2>/dev/null || true)"
              if [[ -n "$CUR_ID" ]]; then
                curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains/$CUR_ID" >/dev/null || true
              fi
              if [[ -n "$OLD_SERVICE" ]]; then
                BODY="$(jq -nc --arg h 00ai.kr --arg s "$OLD_SERVICE" --arg z "$ZONE_ID" '{hostname:$h,service:$s,zone_id:$z,zone_name:"00ai.kr"}')"
                curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$BODY" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains" >/dev/null || true
              fi
              if [[ -n "$OLD_ROUTE_SCRIPT" ]]; then
                CURRENT_ROUTES="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" || echo '{}')"
                HAS_OLD="$(jq -r '[.result[]? | select(.pattern=="00ai.kr/*")]|length' <<<"$CURRENT_ROUTES" 2>/dev/null || echo 0)"
                if [[ "$HAS_OLD" == 0 ]]; then
                  BODY="$(jq -nc --arg p '00ai.kr/*' --arg s "$OLD_ROUTE_SCRIPT" '{pattern:$p,script:$s}')"
                  curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$BODY" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" >/dev/null || true
                fi
              fi
              printf '{"checked_at":"%s","deployed":false,"healthy":false,"rolled_back":true,"old_service":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$OLD_SERVICE" > .github/root-final-health.json
            fi
            exit "$rc"
          }
          trap rollback ERR

          # Remove the exact legacy custom domain and exact legacy apex route.
          if [[ -n "$OLD_DOMAIN_ID" ]]; then
            R="$(curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains/$OLD_DOMAIN_ID")"
            test "$(jq -r '.success' <<<"$R")" = true
            MUTATED=1
          fi
          if [[ -n "$OLD_ROUTE_ID" ]]; then
            R="$(curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$OLD_ROUTE_ID")"
            test "$(jq -r '.success' <<<"$R")" = true
            MUTATED=1
          fi

          # Attach the verified Worker directly via the official Workers Domains API.
          BODY="$(jq -nc --arg h 00ai.kr --arg s "$NEW_SERVICE" --arg z "$ZONE_ID" '{hostname:$h,service:$s,zone_id:$z,zone_name:"00ai.kr"}')"
          R="$(curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$BODY" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains")"
          echo "$R" | jq .
          test "$(jq -r '.success' <<<"$R")" = true
          MUTATED=1

          # Certificate/DNS propagation can take a few seconds. Verify the actual production hostname.
          live=0
          for attempt in 1 2 3 4 5 6 7 8; do
            sleep 8
            ROOT_CODE="$(curl -ksS --max-time 20 -D /tmp/live-root-h -o /tmp/live-root -w '%{http_code}' https://00ai.kr/ || true)"
            API_CODE="$(curl -ksS --max-time 20 -D /tmp/live-api-h -o /tmp/live-api -w '%{http_code}' https://00ai.kr/api/projects || true)"
            MARK="$(tr -d '\r' < /tmp/live-root-h 2>/dev/null | grep -i '^x-00ai-root-router:' | head -n1 || true)"
            if [[ "$ROOT_CODE" == 200 && "$API_CODE" == 200 && "$MARK" == *v2* ]] && grep -q 'policy.00ai.kr' /tmp/live-api && grep -q 'yhub.00ai.kr' /tmp/live-api; then
              live=1
              break
            fi
            echo "attempt=$attempt root=$ROOT_CODE api=$API_CODE marker=$MARK"
          done
          test "$live" = 1

          PLOC="$(curl -ksSI --max-time 20 https://00ai.kr/policy | tr -d '\r' | grep -i '^location:' | head -n1 | cut -d' ' -f2-)"
          HLOC="$(curl -ksSI --max-time 20 https://00ai.kr/harness | tr -d '\r' | grep -i '^location:' | head -n1 | cut -d' ' -f2-)"
          POLICY_API="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://policy.00ai.kr/api/hasa/health)"
          YHUB="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://yhub.00ai.kr/policies)"
          HARNESS="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://harness.00ai.kr/)"
          [[ "$PLOC" == https://policy.00ai.kr* ]]
          [[ "$HLOC" == https://harness.00ai.kr* ]]
          test "$POLICY_API" = 200
          test "$YHUB" = 200
          test "$HARNESS" = 200

          python3 - <<PY
          import json,pathlib,datetime
          d=json.load(open('/tmp/live-api'))
          out={
            'checked_at':datetime.datetime.utcnow().isoformat()+'Z',
            'deployed':True,
            'service':'$NEW_SERVICE',
            'old_service':'$OLD_SERVICE',
            'root':200,'api':200,
            'site_projects':len(d.get('siteProjects',[])),
            'github_projects':len(d.get('githubProjects',[])),
            'policy_redirect':'$PLOC','harness_redirect':'$HLOC',
            'policy_api':int('$POLICY_API'),'yhub':int('$YHUB'),'harness':int('$HARNESS'),
            'healthy':True,
          }
          pathlib.Path('.github/root-final-health.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          SUCCESS=1
          trap - ERR

      - name: Persist final result
        if: always()
        run: |
          if [[ ! -f .github/root-final-health.json ]]; then
            mkdir -p .github
            printf '{"checked_at":"%s","deployed":false,"healthy":false,"reason":"stopped before apex mutation"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/root-final-health.json
          fi
          git config user.name "00AI Bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add .github/root-final-health.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update final root cutover health [skip ci]"
            git push || true
          fi
