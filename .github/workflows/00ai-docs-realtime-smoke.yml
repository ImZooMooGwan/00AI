name: 00AI DOCS Live Realtime Smoke Test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/00ai-docs-realtime-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose live worker routes and asset delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error
          paths=["/","/api/health","/realtime-app/","/realtime-app/assets/index-CVKnn5b-.js","/realtime-app/assets/index-Ne1RMaRW.css"]
          for path in paths:
            url="https://docs.00ai.kr"+path
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (00AI-DOCS-Beta-CI)"})
            try:
              with urllib.request.urlopen(req,timeout=25) as res:
                body=res.read()
                print("PASS",path,res.status,len(body),res.headers.get('content-type'))
                if path=="/realtime-app/":
                  assert b'<div id="root">' in body
            except urllib.error.HTTPError as e:
              print("FAIL",path,e.code,list(e.headers.items()),e.read(600).decode('utf-8',errors='replace'))
              raise
          PY
