name: Atomic cutover 00ai.kr root domain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cutover-root-domain-api.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Resolve account, zone and current apex bindings
        id: state
        shell: bash
        run: |
          set -euo pipefail
          VERIFY="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$(jq -r '.success' <<<"$VERIFY")" = "true"
          ZONES="$(curl -fsS -G -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-urlencode "name=00ai.kr" --data-urlencode "status=active" https://api.cloudflare.com/client/v4/zones)"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          ACCOUNT_ID="$(jq -r '.result[0].account.id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID" && test -n "$ACCOUNT_ID"

          DOMAINS="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains")"
          OLD_DOMAIN_ID="$(jq -r '.result[] | select(.hostname=="00ai.kr") | .id' <<<"$DOMAINS" | head -n1)"
          OLD_SERVICE="$(jq -r '.result[] | select(.hostname=="00ai.kr") | .service' <<<"$DOMAINS" | head -n1)"
          ROUTES="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes")"
          OLD_ROUTE_ID="$(jq -r '.result[] | select(.pattern=="00ai.kr/*") | .id' <<<"$ROUTES" | head -n1)"
          OLD_ROUTE_SCRIPT="$(jq -r '.result[] | select(.pattern=="00ai.kr/*") | .script' <<<"$ROUTES" | head -n1)"

          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "old_domain_id=$OLD_DOMAIN_ID" >> "$GITHUB_OUTPUT"
          echo "old_service=$OLD_SERVICE" >> "$GITHUB_OUTPUT"
          echo "old_route_id=$OLD_ROUTE_ID" >> "$GITHUB_OUTPUT"
          echo "old_route_script=$OLD_ROUTE_SCRIPT" >> "$GITHUB_OUTPUT"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Current apex domain service=${OLD_SERVICE:-none}, route=${OLD_ROUTE_SCRIPT:-none}"

      - name: Upload latest root router script without touching live domain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('apps/root-router/wrangler.jsonc'))
          d['name']='00ai-root-router'
          d['workers_dev']=False
          d.pop('routes',None)
          open('apps/root-router/wrangler.upload-only.jsonc','w').write(json.dumps(d,indent=2)+'\n')
          PY
          npx --yes wrangler@4 deploy --config apps/root-router/wrangler.upload-only.jsonc

      - name: Reconfirm verified preview behavior before detaching production
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW="https://00ai-root-router-debug-v2.able001.workers.dev"
          test "$(curl -ksS --max-time 30 -o /tmp/pre-root.html -w '%{http_code}' "$PREVIEW/")" = "200"
          test "$(curl -ksS --max-time 30 -o /tmp/pre-api.json -w '%{http_code}' "$PREVIEW/api/projects")" = "200"
          grep -q 'policy.00ai.kr' /tmp/pre-api.json
          grep -q 'yhub.00ai.kr' /tmp/pre-api.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pre-api.json'))
          assert len(d.get('siteProjects',[])) >= 10
          PY

      - name: Detach old exact apex domain and old apex route
        id: detach
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.state.outputs.account_id }}
          ZONE_ID: ${{ steps.state.outputs.zone_id }}
          OLD_DOMAIN_ID: ${{ steps.state.outputs.old_domain_id }}
          OLD_ROUTE_ID: ${{ steps.state.outputs.old_route_id }}
        run: |
          set -euo pipefail
          if [[ -n "$OLD_DOMAIN_ID" ]]; then
            RESP="$(curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains/$OLD_DOMAIN_ID")"
            test "$(jq -r '.success' <<<"$RESP")" = "true"
          fi
          if [[ -n "$OLD_ROUTE_ID" ]]; then
            RESP="$(curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$OLD_ROUTE_ID")"
            test "$(jq -r '.success' <<<"$RESP")" = "true"
          fi
          echo "detached=true" >> "$GITHUB_OUTPUT"

      - name: Attach 00ai.kr directly to verified root router
        id: attach
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.state.outputs.account_id }}
          ZONE_ID: ${{ steps.state.outputs.zone_id }}
        run: |
          set -euo pipefail
          BODY="$(jq -nc --arg host '00ai.kr' --arg service '00ai-root-router' --arg zone "$ZONE_ID" '{hostname:$host,service:$service,zone_id:$zone,zone_name:"00ai.kr"}')"
          RESP="$(curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$BODY" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains")"
          echo "$RESP" | jq .
          test "$(jq -r '.success' <<<"$RESP")" = "true"
          NEW_ID="$(jq -r '.result.id // empty' <<<"$RESP")"
          test -n "$NEW_ID"
          echo "new_domain_id=$NEW_ID" >> "$GITHUB_OUTPUT"
          echo "attached=true" >> "$GITHUB_OUTPUT"

      - name: Verify new apex routing and service behavior
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          ROOT_CODE="$(curl -ksS --max-time 30 -D /tmp/new-root.h -o /tmp/new-root.html -w '%{http_code}' https://00ai.kr/)"
          API_CODE="$(curl -ksS --max-time 30 -D /tmp/new-api.h -o /tmp/new-api.json -w '%{http_code}' https://00ai.kr/api/projects)"
          ROOT_MARK="$(tr -d '\r' < /tmp/new-root.h | grep -i '^x-00ai-root-router:' | head -n1 || true)"
          API_MARK="$(tr -d '\r' < /tmp/new-api.h | grep -i '^x-00ai-root-router:' | head -n1 || true)"
          PLOC="$(curl -ksSI --max-time 20 https://00ai.kr/policy | tr -d '\r' | grep -i '^location:' | head -n1 | cut -d' ' -f2-)"
          HLOC="$(curl -ksSI --max-time 20 https://00ai.kr/harness | tr -d '\r' | grep -i '^location:' | head -n1 | cut -d' ' -f2-)"
          POLICY_API="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://policy.00ai.kr/api/hasa/health)"
          YHUB="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://yhub.00ai.kr/policies)"
          HARNESS="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://harness.00ai.kr/)"

          echo "root=$ROOT_CODE api=$API_CODE rootMark=$ROOT_MARK apiMark=$API_MARK"
          test "$ROOT_CODE" = "200"
          test "$API_CODE" = "200"
          [[ "$ROOT_MARK" == *"v2"* ]]
          [[ "$API_MARK" == *"v2"* ]]
          grep -q 'policy.00ai.kr' /tmp/new-api.json
          grep -q 'yhub.00ai.kr' /tmp/new-api.json
          [[ "$PLOC" == https://policy.00ai.kr* ]]
          [[ "$HLOC" == https://harness.00ai.kr* ]]
          test "$POLICY_API" = "200"
          test "$YHUB" = "200"
          test "$HARNESS" = "200"

          mkdir -p .github
          python3 - <<PY
          import json,pathlib,datetime
          api=json.load(open('/tmp/new-api.json'))
          out={
            'checked_at':datetime.datetime.utcnow().isoformat()+'Z',
            'deployed':True,
            'root_router':'v2',
            'root':int('$ROOT_CODE'),
            'api':int('$API_CODE'),
            'site_projects':len(api.get('siteProjects',[])),
            'github_projects':len(api.get('githubProjects',[])),
            'policy_redirect':'$PLOC',
            'harness_redirect':'$HLOC',
            'policy_api':int('$POLICY_API'),
            'yhub':int('$YHUB'),
            'harness':int('$HARNESS'),
            'healthy':True,
          }
          pathlib.Path('.github/root-domain-cutover-health.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          echo "healthy=true" >> "$GITHUB_OUTPUT"

      - name: Roll back to previous portal if verification fails
        if: failure() && steps.detach.outputs.detached == 'true'
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.state.outputs.account_id }}
          ZONE_ID: ${{ steps.state.outputs.zone_id }}
          OLD_SERVICE: ${{ steps.state.outputs.old_service }}
          OLD_ROUTE_SCRIPT: ${{ steps.state.outputs.old_route_script }}
        run: |
          set +e
          DOMAINS="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains")"
          NEW_ID="$(jq -r '.result[] | select(.hostname=="00ai.kr") | .id' <<<"$DOMAINS" | head -n1)"
          if [[ -n "$NEW_ID" ]]; then
            curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains/$NEW_ID" >/dev/null
          fi
          if [[ -n "$OLD_SERVICE" ]]; then
            BODY="$(jq -nc --arg host '00ai.kr' --arg service "$OLD_SERVICE" --arg zone "$ZONE_ID" '{hostname:$host,service:$service,zone_id:$zone,zone_name:"00ai.kr"}')"
            curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$BODY" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains" >/dev/null
          fi
          if [[ -n "$OLD_ROUTE_SCRIPT" ]]; then
            BODY="$(jq -nc --arg pattern '00ai.kr/*' --arg script "$OLD_ROUTE_SCRIPT" '{pattern:$pattern,script:$script}')"
            curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$BODY" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" >/dev/null
          fi
          mkdir -p .github
          printf '{"checked_at":"%s","deployed":false,"healthy":false,"rolled_back":true,"reason":"new root router verification failed; previous portal restored"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/root-domain-cutover-health.json

      - name: Persist cutover result
        if: always()
        shell: bash
        run: |
          if [[ ! -f .github/root-domain-cutover-health.json ]]; then
            mkdir -p .github
            printf '{"checked_at":"%s","deployed":false,"healthy":false,"reason":"cutover stopped before domain mutation"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/root-domain-cutover-health.json
          fi
          git config user.name "00AI Bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add .github/root-domain-cutover-health.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update atomic root cutover health [skip ci]"
            git push || true
          fi
