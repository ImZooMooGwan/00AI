name: Verify stable 00AI browser links

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stable-browser-links.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render portal in Chrome and inspect links
        shell: bash
        run: |
          set +e
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          timeout 25s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 --dump-dom https://00ai.kr/ > /tmp/stable-root.html 2>/tmp/stable-root.log || true
          curl -ksS --max-time 30 https://00ai.kr/api/projects > /tmp/stable-api.json
          python3 - <<'PY'
          import json,re,pathlib,datetime
          html=pathlib.Path('/tmp/stable-root.html').read_text(errors='replace')
          raw=pathlib.Path('/tmp/stable-api.json').read_text(errors='replace')
          try: api=json.loads(raw)
          except: api={}
          hrefs=re.findall(r'href=["\']([^"\']+)["\']',html,re.I)
          custom=[h for h in hrefs if '.00ai.kr' in h]
          urls=[x.get('public_url') for x in api.get('siteProjects',[])]
          out={
            'checked_at':datetime.datetime.utcnow().isoformat()+'Z',
            'dom_bytes':len(html),
            'api_root_router':api.get('rootRouter'),
            'api_site_projects':len(api.get('siteProjects',[])),
            'api_custom_urls':sum(1 for u in urls if isinstance(u,str) and '.00ai.kr' in u),
            'dom_custom_domain_hrefs':custom,
            'dom_has_yhub_project':'청년정책데이터허브' in html,
            'dom_has_policy_project':'정책상황실' in html,
            'runtime_errors':[x for x in pathlib.Path('/tmp/stable-root.log').read_text(errors='replace').splitlines() if re.search(r'uncaught|net::ERR|failed to load|cors',x,re.I)][:20],
          }
          out['healthy']=out['dom_bytes']>10000 and out['api_root_router'] is True and out['api_site_projects']>=10 and out['api_custom_urls']>=10 and out['dom_has_yhub_project'] and out['dom_has_policy_project'] and not out['runtime_errors']
          pathlib.Path('.github/stable-browser-links.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Persist
        if: always()
        run: |
          git config user.name "00AI Bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add .github/stable-browser-links.json || true
          if ! git diff --cached --quiet; then git commit -m "ci: update stable browser link health [skip ci]"; git push || true; fi
