name: Deploy 00AI Workspace
on:
  push:
    branches: [feat/notion-00ai]
    paths:
      - 'apps/notion/**'
      - '.github/workflows/notion-workspace-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/notion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/notion/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npx wrangler d1 migrations apply 00ai-notion --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
