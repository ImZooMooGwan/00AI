name: Atomic cutover 00ai.kr to verified router v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cutover-root-domain-api-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  NEW_SERVICE: 00ai-root-router-debug-v2

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve state and precheck verified Worker
        id: state
        shell: bash
        run: |
          set -euo pipefail
          VERIFY="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$(jq -r '.success' <<<"$VERIFY")" = "true"
          ZONES="$(curl -fsS -G -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-urlencode "name=00ai.kr" --data-urlencode "status=active" https://api.cloudflare.com/client/v4/zones)"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          ACCOUNT_ID="$(jq -r '.result[0].account.id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID" && test -n "$ACCOUNT_ID"

          PREVIEW="https://00ai-root-router-debug-v2.able001.workers.dev"
          test "$(curl -ksS --max-time 30 -o /tmp/pre-root.html -w '%{http_code}' "$PREVIEW/")" = "200"
          test "$(curl -ksS --max-time 30 -o /tmp/pre-api.json -w '%{http_code}' "$PREVIEW/api/projects")" = "200"
          grep -q 'policy.00ai.kr' /tmp/pre-api.json
          grep -q 'yhub.00ai.kr' /tmp/pre-api.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pre-api.json'))
          assert len(d.get('siteProjects',[])) >= 10
          PY

          DOMAINS="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains")"
          OLD_DOMAIN_ID="$(jq -r '.result[] | select(.hostname=="00ai.kr") | .id' <<<"$DOMAINS" | head -n1)"
          OLD_SERVICE="$(jq -r '.result[] | select(.hostname=="00ai.kr") | .service' <<<"$DOMAINS" | head -n1)"
          ROUTES="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes")"
          OLD_ROUTE_ID="$(jq -r '.result[] | select(.pattern=="00ai.kr/*") | .id' <<<"$ROUTES" | head -n1)"
          OLD_ROUTE_SCRIPT="$(jq -r '.result[] | select(.pattern=="00ai.kr/*") | .script' <<<"$ROUTES" | head -n1)"

          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          echo "old_domain_id=$OLD_DOMAIN_ID" >> "$GITHUB_OUTPUT"
          echo "old_service=$OLD_SERVICE" >> "$GITHUB_OUTPUT"
          echo "old_route_id=$OLD_ROUTE_ID" >> "$GITHUB_OUTPUT"
          echo "old_route_script=$OLD_ROUTE_SCRIPT" >> "$GITHUB_OUTPUT"
          echo "Precheck passed; old service=$OLD_SERVICE route=$OLD_ROUTE_SCRIPT"

      - name: Detach old apex bindings
        id: detach
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.state.outputs.account_id }}
          ZONE_ID: ${{ steps.state.outputs.zone_id }}
          OLD_DOMAIN_ID: ${{ steps.state.outputs.old_domain_id }}
          OLD_ROUTE_ID: ${{ steps.state.outputs.old_route_id }}
        run: |
          set -euo pipefail
          if [[ -n "$OLD_DOMAIN_ID" ]]; then
            R="$(curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains/$OLD_DOMAIN_ID")"
            test "$(jq -r '.success' <<<"$R")" = "true"
          fi
          if [[ -n "$OLD_ROUTE_ID" ]]; then
            R="$(curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$OLD_ROUTE_ID")"
            test "$(jq -r '.success' <<<"$R")" = "true"
          fi
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Attach 00ai.kr to verified root router
        id: attach
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.state.outputs.account_id }}
          ZONE_ID: ${{ steps.state.outputs.zone_id }}
        run: |
          set -euo pipefail
          BODY="$(jq -nc --arg host '00ai.kr' --arg service "$NEW_SERVICE" --arg zone "$ZONE_ID" '{hostname:$host,service:$service,zone_id:$zone,zone_name:"00ai.kr"}')"
          R="$(curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$BODY" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains")"
          echo "$R" | jq .
          test "$(jq -r '.success' <<<"$R")" = "true"
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Verify new root with retries
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            ROOT_CODE="$(curl -ksS --max-time 20 -D /tmp/root.h -o /tmp/root.html -w '%{http_code}' https://00ai.kr/ || true)"
            API_CODE="$(curl -ksS --max-time 20 -D /tmp/api.h -o /tmp/api.json -w '%{http_code}' https://00ai.kr/api/projects || true)"
            MARK="$(tr -d '\r' < /tmp/root.h 2>/dev/null | grep -i '^x-00ai-root-router:' | head -n1 || true)"
            if [[ "$ROOT_CODE" == 200 && "$API_CODE" == 200 && "$MARK" == *v2* ]] && grep -q 'policy.00ai.kr' /tmp/api.json && grep -q 'yhub.00ai.kr' /tmp/api.json; then
              ok=true
              break
            fi
            echo "attempt=$attempt root=$ROOT_CODE api=$API_CODE marker=$MARK"
          done
          test "$ok" = true

          PLOC="$(curl -ksSI --max-time 20 https://00ai.kr/policy | tr -d '\r' | grep -i '^location:' | head -n1 | cut -d' ' -f2-)"
          HLOC="$(curl -ksSI --max-time 20 https://00ai.kr/harness | tr -d '\r' | grep -i '^location:' | head -n1 | cut -d' ' -f2-)"
          POLICY_API="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://policy.00ai.kr/api/hasa/health)"
          YHUB="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://yhub.00ai.kr/policies)"
          HARNESS="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://harness.00ai.kr/)"
          [[ "$PLOC" == https://policy.00ai.kr* ]]
          [[ "$HLOC" == https://harness.00ai.kr* ]]
          test "$POLICY_API" = 200
          test "$YHUB" = 200
          test "$HARNESS" = 200

          mkdir -p .github
          python3 - <<PY
          import json,pathlib,datetime
          d=json.load(open('/tmp/api.json'))
          out={
            'checked_at':datetime.datetime.utcnow().isoformat()+'Z',
            'deployed':True,
            'service':'$NEW_SERVICE',
            'root':200,
            'api':200,
            'site_projects':len(d.get('siteProjects',[])),
            'github_projects':len(d.get('githubProjects',[])),
            'policy_redirect':'$PLOC',
            'harness_redirect':'$HLOC',
            'policy_api':int('$POLICY_API'),
            'yhub':int('$YHUB'),
            'harness':int('$HARNESS'),
            'healthy':True,
          }
          pathlib.Path('.github/root-cutover-v2-health.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Roll back if anything after detach fails
        if: failure() && steps.detach.outputs.done == 'true'
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.state.outputs.account_id }}
          ZONE_ID: ${{ steps.state.outputs.zone_id }}
          OLD_SERVICE: ${{ steps.state.outputs.old_service }}
          OLD_ROUTE_SCRIPT: ${{ steps.state.outputs.old_route_script }}
        run: |
          set +e
          D="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains")"
          ID="$(jq -r '.result[] | select(.hostname=="00ai.kr") | .id' <<<"$D" | head -n1)"
          [[ -z "$ID" ]] || curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains/$ID" >/dev/null
          if [[ -n "$OLD_SERVICE" ]]; then
            B="$(jq -nc --arg h '00ai.kr' --arg s "$OLD_SERVICE" --arg z "$ZONE_ID" '{hostname:$h,service:$s,zone_id:$z,zone_name:"00ai.kr"}')"
            curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$B" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains" >/dev/null
          fi
          if [[ -n "$OLD_ROUTE_SCRIPT" ]]; then
            B="$(jq -nc --arg p '00ai.kr/*' --arg s "$OLD_ROUTE_SCRIPT" '{pattern:$p,script:$s}')"
            curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$B" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" >/dev/null
          fi
          mkdir -p .github
          printf '{"checked_at":"%s","deployed":false,"healthy":false,"rolled_back":true}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/root-cutover-v2-health.json

      - name: Persist result
        if: always()
        run: |
          if [[ ! -f .github/root-cutover-v2-health.json ]]; then
            mkdir -p .github
            printf '{"checked_at":"%s","deployed":false,"healthy":false,"reason":"stopped before domain mutation"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/root-cutover-v2-health.json
          fi
          git config user.name "00AI Bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add .github/root-cutover-v2-health.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update verified root cutover v2 health [skip ci]"
            git push || true
          fi
