name: Youth Policy MCP

on:
  push:
    branches: [main]
    paths:
      - "apps/youth-policy-mcp/**"
      - ".github/workflows/youth-policy-mcp.yml"
  pull_request:
    paths:
      - "apps/youth-policy-mcp/**"
      - ".github/workflows/youth-policy-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youth-policy-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/youth-policy-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/youth-policy-mcp/package-lock.json
      - run: npm ci
      - run: npm run types -- --check
      - run: npm run check
      - run: npm test
      - run: npm run build

  portal-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: [mcp, portal-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/youth-policy-mcp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_TOKEN: ${{ secrets.CF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/youth-policy-mcp/package-lock.json
      - run: npm ci

      - name: Resolve Cloudflare credentials and account
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${CLOUDFLARE_API_TOKEN:-}"
          [[ -n "$TOKEN" ]] || TOKEN="${CF_API_TOKEN:-}"
          [[ -n "$TOKEN" ]] || TOKEN="${CLOUDFLARE_TOKEN:-}"
          [[ -n "$TOKEN" ]] || TOKEN="${CF_TOKEN:-}"
          if [[ -z "$TOKEN" ]]; then
            echo "Cloudflare API token is not configured in GitHub Actions." >&2
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          VERIFY="$(curl -fsS \
            -H "Authorization: Bearer $TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          jq -e '.success == true' <<<"$VERIFY" >/dev/null

          ZONES="$(curl -fsS -G \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "name=00ai.kr" \
            --data-urlencode "status=active" \
            https://api.cloudflare.com/client/v4/zones)"
          ACCOUNT_ID="$(jq -r '.result[0].account.id // empty' <<<"$ZONES")"
          if [[ -z "$ACCOUNT_ID" ]]; then
            echo "Cloudflare token cannot resolve the active 00ai.kr account." >&2
            exit 1
          fi

          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Provision the D1 database and production config
        shell: bash
        run: |
          set -euo pipefail
          database_name="00ai-youth-policy"

          find_database_id() {
            ./node_modules/.bin/wrangler d1 list --json \
              | jq -r --arg name "$database_name" \
                '(if type == "array" then .[] else .result[]? end)
                | select(.name == $name)
                | (.uuid // .id // empty)' \
              | head -n 1
          }

          database_id="$(find_database_id)"
          if [[ -z "$database_id" ]]; then
            ./node_modules/.bin/wrangler d1 create "$database_name" --location apac
            database_id="$(find_database_id)"
          fi
          if [[ -z "$database_id" ]]; then
            echo "D1 database provisioning did not return an ID." >&2
            exit 1
          fi

          jq --arg database_id "$database_id" \
            '.d1_databases[0].database_id = $database_id' \
            wrangler.jsonc > wrangler.deploy.jsonc

      - name: Apply D1 migrations
        run: >-
          ./node_modules/.bin/wrangler d1 migrations apply 00ai-youth-policy
          --remote --config wrangler.deploy.jsonc

      - name: Deploy the MCP Worker and custom domain
        run: >-
          ./node_modules/.bin/wrangler deploy
          --config wrangler.deploy.jsonc --minify

      - name: Apply optional source API secrets
        shell: bash
        env:
          YOUTH_POLICY_API_KEY: ${{ secrets.YOUTH_POLICY_API_KEY }}
          LAW_API_OC: ${{ secrets.LAW_API_OC }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          set -euo pipefail
          for name in YOUTH_POLICY_API_KEY LAW_API_OC SYNC_SECRET; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" \
                | ./node_modules/.bin/wrangler secret put "$name" \
                    --config wrangler.deploy.jsonc
            fi
          done

      - name: Verify the live health and MCP protocol
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://mcp.00ai.kr/youth"
          health="${endpoint}/health"

          healthy=false
          for _ in $(seq 1 12); do
            if body="$(curl -fsS --max-time 20 "$health" 2>/dev/null)" \
              && jq -e '.ok == true and .database.connected == true and .tools == 6' \
                <<<"$body" >/dev/null; then
              healthy=true
              break
            fi
            sleep 5
          done
          if [[ "$healthy" != "true" ]]; then
            echo "The deployed MCP health endpoint did not become ready." >&2
            exit 1
          fi

          rpc() {
            local payload="$1"
            local headers body code
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sS --max-time 30 \
              -D "$headers" -o "$body" -w '%{http_code}' \
              -X POST "$endpoint" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -H 'MCP-Protocol-Version: 2025-06-18' \
              --data "$payload")"
            if [[ "$code" != "200" ]]; then
              cat "$body" >&2
              rm -f "$headers" "$body"
              return 1
            fi
            if grep -qi '^content-type:.*text/event-stream' "$headers"; then
              awk '/^data:/ { sub(/^data:[[:space:]]*/, ""); print; exit }' "$body"
            else
              cat "$body"
            fi
            rm -f "$headers" "$body"
          }

          initialize="$(rpc '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"00ai-ci","version":"1.0.0"}}}')"
          jq -e '.result.serverInfo.name == "00ai-youth-policy-mcp"' \
            <<<"$initialize" >/dev/null

          tools="$(rpc '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')"
          jq -e \
            '.result.tools | length == 6 and all(.[]; .annotations.readOnlyHint == true)' \
            <<<"$tools" >/dev/null
