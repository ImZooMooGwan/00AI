name: Deploy 00AI root router v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-root-router-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare account and zone
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          VERIFY="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$(jq -r '.success' <<<"$VERIFY")" = "true"
          ZONES="$(curl -fsS -G -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-urlencode "name=00ai.kr" --data-urlencode "status=active" https://api.cloudflare.com/client/v4/zones)"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          ACCOUNT_ID="$(jq -r '.result[0].account.id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID" && test -n "$ACCOUNT_ID"
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Build preview config beside Worker source
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          src='apps/root-router/wrangler.jsonc'
          dst='apps/root-router/wrangler.preview.jsonc'
          data=json.load(open(src))
          data['name']='00ai-root-router-preview-v2'
          data['workers_dev']=True
          data.pop('routes',None)
          open(dst,'w').write(json.dumps(data,indent=2)+'\n')
          PY

      - name: Deploy and verify isolated preview
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config apps/root-router/wrangler.preview.jsonc 2>&1 | tee /tmp/root-router-v2.log
          PREVIEW="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/root-router-v2.log | tail -n1)"
          test -n "$PREVIEW"
          echo "preview_url=$PREVIEW" >> "$GITHUB_OUTPUT"
          sleep 5

          ROOT_CODE="$(curl -ksS --max-time 30 -o /tmp/r2-root.html -w '%{http_code}' "$PREVIEW/")"
          API_CODE="$(curl -ksS --max-time 30 -o /tmp/r2-api.json -w '%{http_code}' "$PREVIEW/api/projects")"
          POLICY_LOC="$(curl -ksSI --max-time 20 "$PREVIEW/policy" | tr -d '\r' | sed -n 's/^[Ll]ocation:[[:space:]]*//p' | head -n1)"
          HARNESS_LOC="$(curl -ksSI --max-time 20 "$PREVIEW/harness" | tr -d '\r' | sed -n 's/^[Ll]ocation:[[:space:]]*//p' | head -n1)"

          echo "preview=$PREVIEW root=$ROOT_CODE api=$API_CODE policy=$POLICY_LOC harness=$HARNESS_LOC"
          test "$ROOT_CODE" = "200"
          test "$API_CODE" = "200"
          grep -q '00AI' /tmp/r2-root.html
          grep -q 'policy.00ai.kr' /tmp/r2-api.json
          grep -q 'yhub.00ai.kr' /tmp/r2-api.json
          [[ "$POLICY_LOC" == https://policy.00ai.kr* ]]
          [[ "$HARNESS_LOC" == https://harness.00ai.kr* ]]

      - name: Remove stale apex A/AAAA/CNAME records after preview passes
        env:
          ZONE_ID: ${{ steps.cf.outputs.zone_id }}
        shell: bash
        run: |
          set -euo pipefail
          RECORDS="$(curl -fsS -G -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-urlencode "name=00ai.kr" https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records)"
          jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' <<<"$RECORDS" | while read -r id; do
            [[ -n "$id" ]] || continue
            curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$id" >/dev/null
          done

      - name: Deploy root router to 00ai.kr
        run: npx --yes wrangler@4 deploy --config apps/root-router/wrangler.jsonc

      - name: Verify production end to end
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          ROOT_CODE="$(curl -ksS --max-time 30 -o /tmp/r2-prod-root.html -w '%{http_code}' https://00ai.kr/)"
          API_CODE="$(curl -ksS --max-time 30 -o /tmp/r2-prod-api.json -w '%{http_code}' https://00ai.kr/api/projects)"
          POLICY_LOC="$(curl -ksSI --max-time 20 https://00ai.kr/policy | tr -d '\r' | sed -n 's/^[Ll]ocation:[[:space:]]*//p' | head -n1)"
          HARNESS_LOC="$(curl -ksSI --max-time 20 https://00ai.kr/harness | tr -d '\r' | sed -n 's/^[Ll]ocation:[[:space:]]*//p' | head -n1)"
          POLICY_API="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://policy.00ai.kr/api/hasa/health)"
          YHUB="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://yhub.00ai.kr/policies)"
          HARNESS="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://harness.00ai.kr/)"
          test "$ROOT_CODE" = "200"
          test "$API_CODE" = "200"
          grep -q 'policy.00ai.kr' /tmp/r2-prod-api.json
          grep -q 'yhub.00ai.kr' /tmp/r2-prod-api.json
          [[ "$POLICY_LOC" == https://policy.00ai.kr* ]]
          [[ "$HARNESS_LOC" == https://harness.00ai.kr* ]]
          test "$POLICY_API" = "200"
          test "$YHUB" = "200"
          test "$HARNESS" = "200"
          mkdir -p .github
          cat > .github/root-router-v2-health.json <<EOF
          {
            "checked_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deployed":true,
            "preview":"${{ steps.preview.outputs.preview_url }}",
            "root":$ROOT_CODE,
            "api":$API_CODE,
            "policy_redirect":"$POLICY_LOC",
            "harness_redirect":"$HARNESS_LOC",
            "policy_api":$POLICY_API,
            "yhub":$YHUB,
            "harness":$HARNESS,
            "healthy":true
          }
          EOF

      - name: Persist status
        if: always()
        shell: bash
        run: |
          if [[ ! -f .github/root-router-v2-health.json ]]; then
            mkdir -p .github
            printf '{"checked_at":"%s","deployed":false,"healthy":false,"reason":"v2 stopped safely before successful verification"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/root-router-v2-health.json
          fi
          git config user.name "00AI Bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add .github/root-router-v2-health.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update root router v2 health [skip ci]"
            git push || true
          fi
