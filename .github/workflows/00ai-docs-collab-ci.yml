name: 00AI DOCS Realtime Editor CI
on:
  workflow_dispatch:
  push:
    paths:
      - 'gov-docs/staging/**'
      - '!gov-docs/staging/dist/**'
      - '.github/workflows/00ai-docs-collab-ci.yml'
permissions:
  contents: write
concurrency:
  group: 00ai-docs-collab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gov-docs/staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test Yjs CRDT convergence
        run: npm test
      - name: Build Vite
        run: npm run build
      - name: Commit versioned build assets
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f gov-docs/staging/dist
          if ! git diff --cached --quiet; then
            git commit -m "build: publish validated realtime editor bundle [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: 00ai-docs-realtime-editor
          path: gov-docs/staging/dist
          if-no-files-found: error
