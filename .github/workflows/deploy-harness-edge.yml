name: Deploy Harness to Cloudflare edge

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "harness-app-*.js"
      - "harness-*.css"
      - "apps/harness-agent/**"
      - "apps/harness-web/**"
      - ".github/workflows/deploy-harness-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 00ai-harness-edge
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
  CF_TOKEN: ${{ secrets.CF_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build static Harness assets
        run: bash apps/harness-web/build.sh

      - name: Resolve Cloudflare account and zone
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${CLOUDFLARE_API_TOKEN:-}"
          [[ -n "$TOKEN" ]] || TOKEN="${CF_API_TOKEN:-}"
          [[ -n "$TOKEN" ]] || TOKEN="${CLOUDFLARE_TOKEN:-}"
          [[ -n "$TOKEN" ]] || TOKEN="${CF_TOKEN:-}"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          ZONES="$(curl -fsS -G \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "name=00ai.kr" \
            --data-urlencode "status=active" \
            https://api.cloudflare.com/client/v4/zones)"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          ACCOUNT_ID="$(jq -r '.result[0].account.id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID"
          test -n "$ACCOUNT_ID"

          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Validate and deploy Harness Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy \
            --config apps/harness-web/wrangler.jsonc

      - name: Proxy the existing Harness DNS record
        id: dns
        shell: bash
        env:
          ZONE_ID: ${{ steps.cf.outputs.zone_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"
          records="$(curl -fsS -G \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "name=harness.00ai.kr" \
            "$api")"

          ids="$(jq -r '.result[]? | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id' <<<"$records")"
          if [[ -z "$ids" ]]; then
            created="$(curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"type":"CNAME","name":"harness.00ai.kr","content":"ImZooMooGwan.github.io","ttl":1,"proxied":true,"comment":"00AI Harness edge Worker"}' \
              "$api")"
            jq -e '.success == true' <<<"$created" >/dev/null
          else
            while IFS= read -r id; do
              [[ -n "$id" ]] || continue
              patched="$(curl -fsS -X PATCH \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data '{"proxied":true}' \
                "$api/$id")"
              jq -e '.success == true' <<<"$patched" >/dev/null
            done <<<"$ids"
          fi

          EDGE_IP="$(getent ahostsv4 policy.00ai.kr | awk 'NR == 1 { print $1 }')"
          test -n "$EDGE_IP"
          echo "edge_ip=$EDGE_IP" >> "$GITHUB_OUTPUT"

      - name: Verify edge delivery
        shell: bash
        env:
          ZONE_ID: ${{ steps.cf.outputs.zone_id }}
          EDGE_IP: ${{ steps.dns.outputs.edge_ip }}
        run: |
          set -euo pipefail
          healthy=false
          for attempt in {1..12}; do
            headers="$(mktemp)"
            root_code="$(curl -ksS --max-time 25 --resolve "harness.00ai.kr:443:$EDGE_IP" -D "$headers" -o /tmp/harness-root.html -w '%{http_code}' https://harness.00ai.kr/ || true)"
            app_code="$(curl -ksS --max-time 25 --resolve "harness.00ai.kr:443:$EDGE_IP" -o /dev/null -w '%{http_code}' https://harness.00ai.kr/harness-app-v4.js || true)"
            if [[ "$root_code" == "200" && "$app_code" == "200" ]] && \
              grep -qi '^x-00ai-harness: cloudflare-assets-v1' "$headers" && \
              grep -qi '^cache-control: public, max-age=300' "$headers"; then
              healthy=true
              rm -f "$headers"
              break
            fi
            rm -f "$headers"
            sleep 5
          done

          if [[ "$healthy" != "true" ]]; then
            api="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"
            records="$(curl -fsS -G -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-urlencode "name=harness.00ai.kr" "$api")"
            while IFS= read -r id; do
              [[ -n "$id" ]] || continue
              curl -fsS -X PATCH \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data '{"proxied":false}' \
                "$api/$id" >/dev/null
            done < <(jq -r '.result[]? | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id' <<<"$records")
            echo "Harness edge verification failed; DNS was returned to direct GitHub Pages." >&2
            exit 1
          fi

          grep -q '00AI HARNESS' /tmp/harness-root.html
