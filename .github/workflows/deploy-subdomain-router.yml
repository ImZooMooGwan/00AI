name: Deploy 00AI wildcard router

on:
  push:
    branches: [main]
    paths:
      - "apps/subdomain-router/**"
      - "apps/portal/app/data/public-sites.json"
      - ".github/workflows/deploy-subdomain-router.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 00ai-wildcard-router
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
  CF_TOKEN: ${{ secrets.CF_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate public project registry
        shell: bash
        run: |
          set -euo pipefail
          manifest="apps/portal/app/data/public-sites.json"
          jq -e 'type == "array"' "$manifest" >/dev/null
          jq -e 'all(.[];
            (.id | type == "string" and test("^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$")) and
            (.public_url | type == "string" and startswith("https://")) and
            ((.origin_url // .public_url) | type == "string" and startswith("https://")) and
            ((.aliases // []) | type == "array")
          )' "$manifest" >/dev/null

          {
            jq -r '.[] | .id, ((.aliases // [])[])' "$manifest"
            echo drop
          } | awk 'NF && !seen[$0]++' | sort > /tmp/00ai-slugs.txt

          if grep -Ev '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' /tmp/00ai-slugs.txt; then
            echo "Invalid 00AI subdomain slug in public-sites.json" >&2
            exit 1
          fi
          sed 's/$/.00ai.kr/' /tmp/00ai-slugs.txt > /tmp/00ai-hosts.txt

      - name: Resolve Cloudflare credentials and zone
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${CLOUDFLARE_API_TOKEN:-}"
          [[ -n "$TOKEN" ]] || TOKEN="${CF_API_TOKEN:-}"
          [[ -n "$TOKEN" ]] || TOKEN="${CLOUDFLARE_TOKEN:-}"
          [[ -n "$TOKEN" ]] || TOKEN="${CF_TOKEN:-}"

          mkdir -p .github
          if [[ -z "$TOKEN" ]]; then
            cat > .github/cloudflare-domain-health.json <<EOF
          {
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "authenticated": false,
            "deployed": false,
            "wildcard_dns": false,
            "reason": "GitHub Actions secret CLOUDFLARE_API_TOKEN is not configured"
          }
          EOF
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::add-mask::$TOKEN"
          VERIFY="$(curl -fsS -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          if [[ "$(jq -r '.success // false' <<<"$VERIFY")" != "true" ]]; then
            cat > .github/cloudflare-domain-health.json <<EOF
          {
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "authenticated": false,
            "deployed": false,
            "wildcard_dns": false,
            "reason": "Cloudflare API token verification failed"
          }
          EOF
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZONES="$(curl -fsS -G \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "name=00ai.kr" \
            --data-urlencode "status=active" \
            https://api.cloudflare.com/client/v4/zones)"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          ACCOUNT_ID="$(jq -r '.result[0].account.id // empty' <<<"$ZONES")"
          if [[ -z "$ZONE_ID" || -z "$ACCOUNT_ID" ]]; then
            cat > .github/cloudflare-domain-health.json <<EOF
          {
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "authenticated": true,
            "deployed": false,
            "wildcard_dns": false,
            "reason": "Token cannot access the active 00ai.kr zone"
          }
          EOF
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Provision portal ownership validation records
        if: steps.cf.outputs.available == 'true'
        shell: bash
        env:
          ZONE_ID: ${{ steps.cf.outputs.zone_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"

          ensure_txt() {
            local name="$1"
            local value="$2"
            local records
            records="$(curl -fsS -G \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --data-urlencode "type=TXT" \
              --data-urlencode "name=$name" \
              "$api")"
            if jq -e --arg value "$value" 'any(.result[]?; .content == $value)' <<<"$records" >/dev/null; then
              return
            fi
            result="$(curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg name "$name" --arg content "$value" '{type:"TXT", name:$name, content:$content, ttl:1}')" \
              "$api")"
            jq -e '.success == true' <<<"$result" >/dev/null
          }

          ensure_txt "_openai-site-verification.00ai.kr" "openai-site-verification=JUsI_AcUg2jHzra4NxtDix24qFh6ZwDuISeSGIccsfA"
          ensure_txt "_cf-custom-hostname.00ai.kr" "39df0a72-3d03-4917-8e86-ef50205c51b1"
          ensure_txt "_openai-site-verification.www.00ai.kr" "openai-site-verification=svtXswgtBIJ0f7aywCZ7q28eTGqm2xdAou2rnMrJJIM"
          ensure_txt "_cf-custom-hostname.www.00ai.kr" "57e21012-bb39-480b-99b5-503fe6c9aad9"

      - name: Provision one proxied wildcard DNS record
        id: dns
        if: steps.cf.outputs.available == 'true'
        shell: bash
        env:
          ZONE_ID: ${{ steps.cf.outputs.zone_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"
          records="$(curl -fsS -G \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "name=*.00ai.kr" \
            "$api")"

          address_ids="$(jq -r '.result[]? | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id' <<<"$records")"
          if [[ -z "$address_ids" ]]; then
            result="$(curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"type":"A","name":"*.00ai.kr","content":"192.0.2.1","ttl":1,"proxied":true,"comment":"00AI wildcard Worker router"}' \
              "$api")"
            jq -e '.success == true' <<<"$result" >/dev/null
          else
            while IFS= read -r id; do
              [[ -n "$id" ]] || continue
              result="$(curl -fsS -X PATCH \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data '{"proxied":true}' \
                "$api/$id")"
              jq -e '.success == true' <<<"$result" >/dev/null
            done <<<"$address_ids"
          fi

          check="$(curl -fsS -G \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "name=*.00ai.kr" \
            "$api")"
          jq -e 'any(.result[]?; (.type == "A" or .type == "AAAA" or .type == "CNAME") and .proxied == true)' <<<"$check" >/dev/null
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Proxy existing exact service records
        if: steps.cf.outputs.available == 'true'
        shell: bash
        env:
          ZONE_ID: ${{ steps.cf.outputs.zone_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"
          while IFS= read -r host; do
            records="$(curl -fsS -G \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --data-urlencode "name=$host" \
              "$api")"
            while IFS= read -r id; do
              [[ -n "$id" ]] || continue
              result="$(curl -sS -X PATCH \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data '{"proxied":true}' \
                "$api/$id" || true)"
              if ! jq -e '.success == true' <<<"$result" >/dev/null 2>&1; then
                echo "Warning: could not proxy an existing exact record for $host; final route verification will report it." >&2
              fi
            done < <(jq -r '.result[]? | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id' <<<"$records")
          done < /tmp/00ai-hosts.txt

      - name: Validate and deploy wildcard router
        id: deploy
        if: steps.cf.outputs.available == 'true'
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy \
            --config apps/subdomain-router/wrangler.jsonc \
            --minify 2>&1 | tee /tmp/wrangler-deploy.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify wildcard DNS, TLS and every registered route
        id: verify
        if: steps.cf.outputs.available == 'true'
        shell: bash
        run: |
          set -u
          sleep 30
          tmp="$(mktemp)"
          all_ok=true
          printf '{\n  "checked_at": "%s",\n  "authenticated": true,\n  "deployed": %s,\n  "wildcard_dns": %s,\n  "deploy_exit_code": "%s",\n  "domains": {\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$([[ "${{ steps.deploy.outputs.status }}" == "0" ]] && echo true || echo false)" \
            "${{ steps.dns.outputs.ready }}" \
            "${{ steps.deploy.outputs.status }}" > "$tmp"

          first=true
          while IFS= read -r host; do
            resolved=false
            getent ahosts "$host" >/dev/null 2>&1 && resolved=true

            headers="$(mktemp)"
            code="000"
            if [[ "$resolved" == "true" ]]; then
              code="$(curl -ksS --max-time 20 -o /dev/null -D "$headers" -w '%{http_code}' "https://${host}/" || true)"
            fi
            routed=false
            grep -qi '^x-00ai-router: subdomain-router-v2' "$headers" 2>/dev/null && routed=true

            healthy=false
            if [[ "$resolved" == "true" && "$routed" == "true" && "$code" =~ ^[0-9]{3}$ && "$code" -ge 200 && "$code" -lt 500 ]]; then
              healthy=true
            else
              all_ok=false
            fi
            echo "$host resolved=$resolved http=$code routed=$routed healthy=$healthy"

            if [[ "$first" != "true" ]]; then printf ',\n' >> "$tmp"; fi
            first=false
            printf '    "%s": {"resolved": %s, "http": "%s", "routed": %s, "healthy": %s}' \
              "$host" "$resolved" "$code" "$routed" "$healthy" >> "$tmp"
            rm -f "$headers"
          done < /tmp/00ai-hosts.txt

          printf '\n  },\n  "healthy": %s\n}\n' "$all_ok" >> "$tmp"
          mv "$tmp" .github/cloudflare-domain-health.json
          echo "healthy=$all_ok" >> "$GITHUB_OUTPUT"
          cat .github/cloudflare-domain-health.json

      - name: Promote verified subdomains and persist deployment state
        if: always()
        shell: bash
        run: |
          if [[ ! -f .github/cloudflare-domain-health.json ]]; then
            cat > .github/cloudflare-domain-health.json <<EOF
          {
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "authenticated": false,
            "deployed": false,
            "wildcard_dns": false,
            "reason": "Cloudflare deployment did not reach verification"
          }
          EOF
          fi
          if [[ "${{ steps.verify.outputs.healthy }}" == "true" ]]; then
            manifest="apps/portal/app/data/public-sites.json"
            updated="$(mktemp)"
            jq 'map(.public_url = ("https://" + .id + ".00ai.kr"))' "$manifest" > "$updated"
            mv "$updated" "$manifest"
          fi
          git config user.name "00AI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/cloudflare-domain-health.json apps/portal/app/data/public-sites.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update 00AI wildcard deployment state [skip ci]"
            git push || true
          fi

      - name: Fail when Cloudflare authentication or routing is unavailable
        if: steps.cf.outputs.available != 'true' || steps.verify.outputs.healthy != 'true'
        run: exit 1
