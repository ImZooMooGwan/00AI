name: 00AI domain smoke test

on:
  push:
    branches: [main]
    paths:
      - "apps/portal/**"
      - ".github/workflows/domain-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Wait for deployment and DNS
        run: sleep 90

      - name: Verify 00AI domains and write status
        id: check
        shell: bash
        run: |
          set -u
          domains=(
            "00ai.kr"
            "harness.00ai.kr"
            "policy.00ai.kr"
            "public-ai-gov.00ai.kr"
            "yhub.00ai.kr"
            "youth-policy-data-hub.00ai.kr"
            "drop.00ai.kr"
          )

          mkdir -p .github
          tmp="$(mktemp)"
          ok=true
          printf '{\n  "checked_at": "%s",\n  "commit": "%s",\n  "domains": {\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" > "$tmp"

          first=true
          for domain in "${domains[@]}"; do
            echo "=== ${domain} ==="
            resolved=false
            if getent ahosts "$domain" >/tmp/hosts 2>/dev/null; then
              resolved=true
              head -n 3 /tmp/hosts || true
            fi

            code="000"
            if [[ "$resolved" == "true" ]]; then
              code="$(curl --location --silent --show-error --output /dev/null \
                --write-out '%{http_code}' --max-time 25 "https://${domain}/" || true)"
            fi
            echo "resolved=${resolved} HTTP=${code}"

            healthy=false
            if [[ "$resolved" == "true" && "$code" =~ ^[0-9]{3}$ && "$code" -ge 200 && "$code" -lt 500 ]]; then
              healthy=true
            else
              ok=false
            fi

            if [[ "$first" != "true" ]]; then printf ',\n' >> "$tmp"; fi
            first=false
            printf '    "%s": {"resolved": %s, "http": "%s", "healthy": %s}' \
              "$domain" "$resolved" "$code" "$healthy" >> "$tmp"
          done

          printf '\n  },\n  "healthy": %s\n}\n' "$ok" >> "$tmp"
          mv "$tmp" .github/domain-health.json
          echo "healthy=$ok" >> "$GITHUB_OUTPUT"
          cat .github/domain-health.json

      - name: Persist domain health result
        shell: bash
        run: |
          git config user.name "00AI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/domain-health.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update domain health [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep 2
            done
            echo "Warning: domains are healthy, but the diagnostic file raced with another workflow." >&2
          fi

      - name: Fail if any domain is unhealthy
        if: steps.check.outputs.healthy != 'true'
        run: exit 1
