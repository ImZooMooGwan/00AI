name: Deploy 00AI root router

on:
  push:
    branches: [main]
    paths:
      - "apps/root-router/**"
      - ".github/workflows/deploy-root-router.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare account and zone
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          VERIFY="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$(jq -r '.success' <<<"$VERIFY")" = "true"
          ZONES="$(curl -fsS -G -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-urlencode "name=00ai.kr" --data-urlencode "status=active" https://api.cloudflare.com/client/v4/zones)"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          ACCOUNT_ID="$(jq -r '.result[0].account.id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID" && test -n "$ACCOUNT_ID"
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy and verify isolated preview first
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='apps/root-router/wrangler.jsonc'
          data=json.load(open(p))
          data['name']='00ai-root-router-preview'
          data['workers_dev']=True
          data.pop('routes',None)
          open('/tmp/root-router-preview.jsonc','w').write(json.dumps(data))
          PY
          npx --yes wrangler@4 deploy --config /tmp/root-router-preview.jsonc 2>&1 | tee /tmp/root-router-preview.log
          PREVIEW="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/root-router-preview.log | tail -n1)"
          test -n "$PREVIEW"
          echo "preview_url=$PREVIEW" >> "$GITHUB_OUTPUT"

          ROOT_CODE="$(curl -ksS --max-time 30 -o /tmp/root-preview.html -w '%{http_code}' "$PREVIEW/")"
          API_CODE="$(curl -ksS --max-time 30 -o /tmp/root-preview-api.json -w '%{http_code}' "$PREVIEW/api/projects")"
          POLICY_LOC="$(curl -ksSI --max-time 20 "$PREVIEW/policy" | tr -d '\r' | awk 'tolower($1)=="location:" {$1=""; sub(/^ /,""); print; exit}')"
          HARNESS_LOC="$(curl -ksSI --max-time 20 "$PREVIEW/harness" | tr -d '\r' | awk 'tolower($1)=="location:" {$1=""; sub(/^ /,""); print; exit}')"

          test "$ROOT_CODE" = "200"
          test "$API_CODE" = "200"
          grep -q '00AI' /tmp/root-preview.html
          grep -q 'policy.00ai.kr' /tmp/root-preview-api.json
          grep -q 'yhub.00ai.kr' /tmp/root-preview-api.json
          [[ "$POLICY_LOC" == https://policy.00ai.kr* ]]
          [[ "$HARNESS_LOC" == https://harness.00ai.kr* ]]

      - name: Remove stale apex web DNS only after preview succeeds
        shell: bash
        env:
          ZONE_ID: ${{ steps.cf.outputs.zone_id }}
        run: |
          set -euo pipefail
          RECORDS="$(curl -fsS -G -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-urlencode "name=00ai.kr" https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records)"
          jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | [.id,.type,.content] | @tsv' <<<"$RECORDS" | while IFS=$'\t' read -r id type content; do
            [[ -n "$id" ]] || continue
            echo "Removing stale apex web record: $type $content"
            curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$id >/dev/null
          done

      - name: Deploy root router to 00ai.kr
        run: npx --yes wrangler@4 deploy --config apps/root-router/wrangler.jsonc

      - name: Verify production portal navigation and APIs
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          ROOT_CODE="$(curl -ksS --max-time 30 -o /tmp/root-prod.html -w '%{http_code}' https://00ai.kr/)"
          API_CODE="$(curl -ksS --max-time 30 -o /tmp/root-prod-api.json -w '%{http_code}' https://00ai.kr/api/projects)"
          POLICY_LOC="$(curl -ksSI --max-time 20 https://00ai.kr/policy | tr -d '\r' | awk 'tolower($1)=="location:" {$1=""; sub(/^ /,""); print; exit}')"
          HARNESS_LOC="$(curl -ksSI --max-time 20 https://00ai.kr/harness | tr -d '\r' | awk 'tolower($1)=="location:" {$1=""; sub(/^ /,""); print; exit}')"
          POLICY_CODE="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://policy.00ai.kr/api/hasa/health)"
          YHUB_CODE="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://yhub.00ai.kr/policies)"
          HARNESS_CODE="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://harness.00ai.kr/)"

          test "$ROOT_CODE" = "200"
          test "$API_CODE" = "200"
          grep -q 'policy.00ai.kr' /tmp/root-prod-api.json
          grep -q 'yhub.00ai.kr' /tmp/root-prod-api.json
          [[ "$POLICY_LOC" == https://policy.00ai.kr* ]]
          [[ "$HARNESS_LOC" == https://harness.00ai.kr* ]]
          test "$POLICY_CODE" = "200"
          test "$YHUB_CODE" = "200"
          test "$HARNESS_CODE" = "200"

          mkdir -p .github
          cat > .github/root-router-health.json <<EOF
          {
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deployed": true,
            "preview": "${{ steps.preview.outputs.preview_url }}",
            "root": "$ROOT_CODE",
            "api": "$API_CODE",
            "policy_redirect": "$POLICY_LOC",
            "harness_redirect": "$HARNESS_LOC",
            "policy_api": "$POLICY_CODE",
            "yhub": "$YHUB_CODE",
            "harness": "$HARNESS_CODE",
            "healthy": true
          }
          EOF

      - name: Persist health report
        if: always()
        shell: bash
        run: |
          if [[ ! -f .github/root-router-health.json ]]; then
            mkdir -p .github
            cat > .github/root-router-health.json <<EOF
          {
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deployed": false,
            "healthy": false,
            "reason": "Root router deployment stopped safely before successful verification"
          }
          EOF
          fi
          git config user.name "00AI Bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add .github/root-router-health.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update root router health [skip ci]"
            git push || true
          fi
