name: Deploy 00AI root router v3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-root-router-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare account and zone
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          VERIFY="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$(jq -r '.success' <<<"$VERIFY")" = "true"
          ZONES="$(curl -fsS -G -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-urlencode "name=00ai.kr" --data-urlencode "status=active" https://api.cloudflare.com/client/v4/zones)"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          ACCOUNT_ID="$(jq -r '.result[0].account.id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID" && test -n "$ACCOUNT_ID"
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Create preview configuration beside source
        run: |
          python3 - <<'PY'
          import json
          p='apps/root-router/wrangler.jsonc'
          d=json.load(open(p))
          d['name']='00ai-root-router-preview-v3'
          d['workers_dev']=True
          d.pop('routes',None)
          open('apps/root-router/wrangler.preview-v3.jsonc','w').write(json.dumps(d,indent=2)+'\n')
          PY

      - name: Deploy preview and verify bundled registry
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config apps/root-router/wrangler.preview-v3.jsonc 2>&1 | tee /tmp/root-v3-preview.log
          PREVIEW="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/root-v3-preview.log | tail -n1)"
          test -n "$PREVIEW"
          echo "preview_url=$PREVIEW" >> "$GITHUB_OUTPUT"
          sleep 5

          ROOT="$(curl -ksS --max-time 30 -o /tmp/v3-root.html -w '%{http_code}' "$PREVIEW/")"
          API="$(curl -ksS --max-time 30 -o /tmp/v3-api.json -w '%{http_code}' "$PREVIEW/api/projects")"
          PLOC="$(curl -ksSI --max-time 20 "$PREVIEW/policy" | tr -d '\r' | grep -i '^location:' | head -n1 | cut -d' ' -f2-)"
          HLOC="$(curl -ksSI --max-time 20 "$PREVIEW/harness" | tr -d '\r' | grep -i '^location:' | head -n1 | cut -d' ' -f2-)"

          echo "preview root=$ROOT api=$API policy=$PLOC harness=$HLOC"
          test "$ROOT" = "200"
          test "$API" = "200"
          grep -q '00AI' /tmp/v3-root.html
          grep -q 'policy.00ai.kr' /tmp/v3-api.json
          grep -q 'yhub.00ai.kr' /tmp/v3-api.json
          grep -q 'oneul-daejeon.00ai.kr' /tmp/v3-api.json
          [[ "$PLOC" == https://policy.00ai.kr* ]]
          [[ "$HLOC" == https://harness.00ai.kr* ]]
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/v3-api.json'))
          sites=d.get('siteProjects',[])
          assert len(sites) >= 10, len(sites)
          assert d.get('sources',{}).get('sites',{}).get('available') is True
          print('siteProjects',len(sites),'githubProjects',len(d.get('githubProjects',[])))
          PY

      - name: Remove stale apex web records only after preview passes
        env:
          ZONE_ID: ${{ steps.cf.outputs.zone_id }}
        shell: bash
        run: |
          set -euo pipefail
          RECORDS="$(curl -fsS -G -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-urlencode "name=00ai.kr" https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records)"
          jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' <<<"$RECORDS" | while read -r id; do
            [[ -n "$id" ]] || continue
            curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$id" >/dev/null
          done

      - name: Deploy verified root router to 00ai.kr
        run: npx --yes wrangler@4 deploy --config apps/root-router/wrangler.jsonc

      - name: Verify production functionality
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          ROOT="$(curl -ksS --max-time 30 -o /tmp/v3-prod-root.html -w '%{http_code}' https://00ai.kr/)"
          API="$(curl -ksS --max-time 30 -o /tmp/v3-prod-api.json -w '%{http_code}' https://00ai.kr/api/projects)"
          PLOC="$(curl -ksSI --max-time 20 https://00ai.kr/policy | tr -d '\r' | grep -i '^location:' | head -n1 | cut -d' ' -f2-)"
          HLOC="$(curl -ksSI --max-time 20 https://00ai.kr/harness | tr -d '\r' | grep -i '^location:' | head -n1 | cut -d' ' -f2-)"
          POLICY_API="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://policy.00ai.kr/api/hasa/health)"
          YHUB="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://yhub.00ai.kr/policies)"
          HARNESS="$(curl -ksS --max-time 30 -o /dev/null -w '%{http_code}' https://harness.00ai.kr/)"

          test "$ROOT" = "200"
          test "$API" = "200"
          grep -q 'policy.00ai.kr' /tmp/v3-prod-api.json
          grep -q 'yhub.00ai.kr' /tmp/v3-prod-api.json
          [[ "$PLOC" == https://policy.00ai.kr* ]]
          [[ "$HLOC" == https://harness.00ai.kr* ]]
          test "$POLICY_API" = "200"
          test "$YHUB" = "200"
          test "$HARNESS" = "200"

          mkdir -p .github
          python3 - <<PY
          import json,pathlib,datetime
          api=json.load(open('/tmp/v3-prod-api.json'))
          out={
            'checked_at':datetime.datetime.utcnow().isoformat()+'Z',
            'deployed':True,
            'preview':'${{ steps.preview.outputs.preview_url }}',
            'root':int('$ROOT'),
            'api':int('$API'),
            'site_projects':len(api.get('siteProjects',[])),
            'github_projects':len(api.get('githubProjects',[])),
            'policy_redirect':'$PLOC',
            'harness_redirect':'$HLOC',
            'policy_api':int('$POLICY_API'),
            'yhub':int('$YHUB'),
            'harness':int('$HARNESS'),
            'healthy':True,
          }
          pathlib.Path('.github/root-router-v3-health.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Persist result
        if: always()
        run: |
          if [[ ! -f .github/root-router-v3-health.json ]]; then
            mkdir -p .github
            printf '{"checked_at":"%s","deployed":false,"healthy":false,"reason":"v3 stopped safely before successful verification"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/root-router-v3-health.json
          fi
          git config user.name "00AI Bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add .github/root-router-v3-health.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update root router v3 health [skip ci]"
            git push || true
          fi
